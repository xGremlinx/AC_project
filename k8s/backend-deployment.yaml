apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:
      containers:

      - name: backend

        image: 082319703213.dkr.ecr.us-east-1.amazonaws.com/backend-app

        imagePullPolicy: Never

        ports:
        - containerPort: 5000

        volumeMounts:
         - name: users-storage
           mountPath: /app

        volumes:
        - name: users-storage
          hostPath:
            path: /tmp/users-data
            type: DirectoryOrCreate